# Build the shoebox image and push it to Artifact Registry.
#
# Wire this to a Cloud Build trigger on pushes to main, or run it by hand:
#
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_REPOSITORY=shoebox
#
# The Cloud Run jobs and service are deployed separately by Terraform (see
# deploy/README.md); this only produces the image they run. Terraform pins the
# image by digest, so a build alone never changes what is running in production
# -- you apply Terraform to roll forward.

substitutions:
  _REGION: us-central1
  _REPOSITORY: shoebox
  _IMAGE: shoebox

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest"

steps:
  # Tests run in the image's own interpreter, so a dependency that resolves
  # differently in the container than on a workstation fails here rather than
  # at 3am in a scheduled job.
  - id: test
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --upgrade pip
        pip install --quiet -e ".[dev]"
        ruff check .
        ruff format --check .
        pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest
      # Reuse the previous image's layers so a code-only change does not
      # reinstall every dependency.
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest
      - .
    waitFor: ["test"]

  # Print the digest to pin in deploy/terraform.tfvars.
  - id: digest
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker image inspect \
          --format '{{index .RepoDigests 0}}' \
          ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA} \
          || echo "digest available after push"
    waitFor: ["build"]

timeout: 1800s
