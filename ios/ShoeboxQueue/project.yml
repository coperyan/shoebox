# XcodeGen spec for the Shoebox Queue iOS app.
#   brew install xcodegen
#   cd ios/ShoeboxQueue && xcodegen generate && open ShoeboxQueue.xcodeproj
# The .xcodeproj and the generated Info.plist are git-ignored; this file is the source of truth.
name: ShoeboxQueue

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team here (or pick it in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ShoeboxQueue:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShoeboxQueue
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShoeboxQueue
        PRODUCT_NAME: ShoeboxQueue
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    info:
      path: ShoeboxQueue/Info.plist
      properties:
        CFBundleDisplayName: Shoebox Queue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSPhotoLibraryUsageDescription: "Shoebox Queue attaches card photos from your library to listing rows."
        # Localhost-only exception so you can run against `shoebox api` on http://localhost:8080
        # from the simulator. No NSAllowsArbitraryLoads: a Cloud Run URL must be https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  ShoeboxQueueTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShoeboxQueueTests
        excludes:
          - "Fixtures/**"
      - path: ShoeboxQueueTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: ShoeboxQueue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShoeboxQueueTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ShoeboxQueue:
    build:
      targets:
        ShoeboxQueue: all
        ShoeboxQueueTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ShoeboxQueueTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
