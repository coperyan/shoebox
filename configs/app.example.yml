# Template for configs/app.yaml (gitignored -- holds real credentials).
# Copy this file to configs/app.yaml and fill in your values, or point the
# SHOEBOX_CONFIG_PATH env var at a config elsewhere.
#
# Schema is validated by shoebox/settings.py (extra keys are rejected).

gcp:
  project_id: my-gcp-project
  # Path to a service-account json file. Prefer ADC/Secret Manager in production.
  service_account_json: configs/gcp.json

bigquery:
  checklist_dataset: checklist
  ebay_dataset: ebay
  images_dataset: images

gcs:
  image_bucket: my-image-bucket
  metadata_bucket: my-metadata-bucket
  ebay_bucket: my-ebay-bucket
  image_log_bucket: my-image-log-bucket

paths:
  data_dir: data
  # Must point at the repo's SQL files or BigQueryClient.run_query raises FileNotFoundError.
  query_dir: configs/bigquery/queries
  exports_dir: exports
  scans_dir: scans
  set_images_dir: set_images
  tools_dir: tools
  # How your scanner/camera names files. A bare scan number entered in the UI
  # or queue workbook is resolved to:
  #   scans_dir/<scan_prefix><number zero-padded to scan_number_padding><scan_extension>
  # e.g. prefix "SCAN_", padding 4, extension ".jpg" -> scans/SCAN_0123.jpg
  #      prefix "IMG",   padding 5, extension ".png" -> scans/IMG00123.png
  scan_prefix: "SCAN_"
  scan_number_padding: 4
  scan_extension: ".jpg"
  # Saved eBay search definitions (gitignored; copy from searches.example.yml).
  # May also point at a clone of a separate private repo so searches can be
  # edited from anywhere (GitHub web/mobile) -- see searches_git_pull below.
  searches_file: configs/searches.yaml
  # When true, watch-searches runs `git pull --ff-only` in the directory
  # containing searches_file before every run (including --list/--dry-run),
  # picking up edits pushed from anywhere. Pull failures are logged and the
  # run continues with the last-synced file; a file that is broken still
  # fails the run loudly. Requires searches_file to live inside a git clone
  # with an upstream and non-interactive auth (e.g. `gh auth setup-git`).
  searches_git_pull: false

ebay:
  # application/user/header name the entries to use in ebay_rest.json
  # (see configs/ebay_rest.example.json and the ebay_rest package docs:
  # https://github.com/matecsaj/ebay_rest).
  application: production_1
  user: production_1
  header: US
  # Directory containing ebay_rest.json (overridable via EBAY_REST_CONFIG_PATH).
  path: configs
  # Default promoted-listings campaign for new listings.
  campaign_id: "123456789"
  # Trading API (Auth'n'Auth) token file; only read by pipelines that use it.
  trading_token_path: configs/ebay_legacy.json

slack:
  # Bot User OAuth Token (OAuth & Permissions page). Scopes: chat:write,
  # channels:history (groups:history for private channels), reactions:read.
  bot_token: xoxb-your-bot-token
  # App-level token with connections:write, for Socket Mode.
  app_token: xapp-your-app-token
  # Channel IDs (not names): channel details -> copy ID at the bottom.
  # The bot must be invited to each channel (/invite @YourBot).
  notify_channel: C0123456789 # pipeline status + order summaries
  pricing_channel: C0123456789 # price confirmation/approval prompts
  command_channel: C0123456789 # chat-triggered CLI commands (slack-bot service)
  # Saved-search hits (watch-searches). Optional -- falls back to notify_channel.
  search_channel: C0123456789
  # send-offers prompts. Optional; falls back to pricing_channel when unset.
  offers_channel: C0123456789
  # Slack user IDs allowed to run commands in command_channel; empty = anyone
  # in the channel. Find yours: Slack profile -> "..." -> Copy member ID.
  allowed_user_ids: []
  # allowed_user_ids: ["U0123456789"]

google_calendar:
  # Target calendar for the Topps release sync.
  calendar_id: your-calendar-id@group.calendar.google.com

# Trading Card Database (tcdb.com) browser automation -- `shoebox tcdb-search`.
# Optional: every key has a default. See docs/tcdb.md.
tcdb:
  # Persistent Chrome profile so the Cloudflare clearance and your TCDB login
  # survive between runs (log in by hand once, tick "Remember").
  profile_dir: data/tcdb_chrome_profile
  # How long to wait for you to finish logging in before giving up.
  login_timeout_s: 300
  # Advanced-search defaults applied to every search unless overridden with a
  # CLI flag or `set field=value` in the session. Any of: category, year,
  # set_name, set_type, card_number, name, team, note.
  search_defaults:
    category: Baseball
    # name: Bonds

# Store-specific identity + eBay account values used when building listings.
# Every field has a safe placeholder default in settings.py, so this whole
# section is optional for the app to *load* -- but you must set real values
# before creating live listings, or eBay will reject the offers.
store:
  # Public store name shown in the listing description footer.
  name: "Your Store Name"
  # eBay inventory location key (Account -> Business info -> Locations).
  merchant_location_key: "YOUR_LOCATION_KEY"
  # eBay leaf category ID (261328 = Sports Trading Cards -> Singles).
  category_id: "261328"
  # Item condition enum for single-card listings.
  # https://developer.ebay.com/api-docs/sell/inventory/types/slr:ConditionEnum
  # Limited to ungraded for now
  condition: "USED_VERY_GOOD"
  # One of NEAR_MINT_OR_BETTER, EXCELLENT, VERY_GOOD, POOR
  # https://developer.ebay.com/api-docs/user-guides/static/mip-user-guide/mip-enum-condition-descriptor-ids-for-trading-cards.html
  condition_descriptor: "NEAR_MINT_OR_BETTER"
  # Message attached to seller-initiated best offers (negotiation API).
  offer_message: "Enjoy the discount on this card! Valid for the next 24 hours. Thank you!"
  # Single-card listings <= this price use the "low" fulfillment policy.
  fulfillment_low_max_price: 19.99
  # eBay business policy IDs (Account -> Business policies).
  policies:
    payment_policy_id: "0000000000"
    return_policy_id: "0000000000"
    fulfillment_policy_id_low: "0000000000" # single cards <= fulfillment_low_max_price (eBay PWE)
    fulfillment_policy_id_high: "0000000000" # single cards above it (USPS Ground Advantage)
    fulfillment_policy_id_variation: "0000000000" # "You Pick" / variation listings (Free PWE Shipping)
  # Promoted-listings campaigns. Resolution: by_sport -> by_set ->
  # current-year default -> default.
  ad_campaigns:
    default: "0000000000"
    # current_year: "2025"              # sets starting with this use current_year_default
    # current_year_default: "0000000000"
    by_sport:
      Basketball: "0000000000"
      Football: "0000000000"
    by_set: {}
      # "2025 Topps Chrome": "0000000000"
