# Team and title crosswalk
#
# Lookups keyed off the eBay "Team" item specific, plus title shorthand:
#
#   teams:             eBay "Team" item specific  ->  short name used in titles
#   store_categories:  eBay "Team" item specific  ->  eBay store category home
#   token_expansions:  title shorthand            ->  the word buyers search
#
# Team groups are flattened into one map for title lookups, but the group name
# is meaningful to store-category routing (see store_categories.group_sports),
# so put a team in the group matching its league. Keys are matched
# case-insensitively with whitespace collapsed, so "los angeles  dodgers" still
# resolves. A team with no entry here is left out of the title rather than
# guessed at, so add new/renamed franchises (and any misspellings eBay hands
# back) as you hit them.
#
# Historical, minor-league, and college names live alongside current ones on
# purpose: vintage and prospect cards carry those values in item specifics.

