# eBay store category routing for the "Team" item specific.
#
# Two questions this answers, both of which the raw item specific gets wrong
# often enough to matter:
#
#   which sport branch?   group_sports maps a `teams:` group to a sport, so a
#                         card tagged "Denver Nuggets" lands under Basketball
#                         even when its Sport item specific says Baseball.
#                         A group mapped to null (college) has no implied
#                         sport; callers fall back to the listing's Sport.
#
#   which team category?  team_parents folds a franchise's alternate, historical
#                         and minor-league names into the one category a buyer
#                         would look under. Only exceptions are listed: a team
#                         with no entry keeps its own name, which is already the
#                         full "City Nickname" for every current club.
#
# Categories use the full city name ("San Francisco Giants", not "Giants") --
# unlike titles, which use the short forms in `teams:` above, where the space
# is tight. Full names also keep the leagues apart on their own: short names
# collide (NFL Arizona and MLB St. Louis are both "Cardinals") and full ones
# do not.
#
# Both sides are full eBay team values: keys are the value eBay hands back,
# values are the club it should file under, which must itself be a key in
# `teams:` above -- naming one "Diamondbacks" while the club is "Arizona
# Diamondbacks" silently splits it in two.
store_categories:
  # Where teams with no usable category go: league-level values on All-Star
  # cards, college programs, and anything not yet in the crosswalk.
  unmapped_team: "Other Teams"

  group_sports:
    mlb: Baseball
    mlb_historical: Baseball
    mlb_minors: Baseball
    nfl: Football
    nba: Basketball
    college: null

  team_parents:
    # --- MLB: city variants and misspellings ---------------------------------
    # eBay returns the A's with and without a city; all three eras are one club.
    "Oakland Athletics": "Athletics"
    "Philadelphia Athletics": "Athletics"
    "Kansas City Athletics": "Athletics"
    "Angels": "Los Angeles Angels"
    "Anaheim Angels": "Los Angeles Angels"
    "California Angels": "Los Angeles Angels"
    "California Los Angeles Angels": "Los Angeles Angels"
    "Cleveland": "Cleveland Guardians"
    "Cincinatti Reds": "Cincinnati Reds"
    "Kanas City Royals": "Kansas City Royals"

    # --- MLB: renamed, relocated, or defunct ---------------------------------
    "Cleveland Indians": "Cleveland Guardians"
    "Boston Braves": "Atlanta Braves"
    "Milwaukee Braves": "Atlanta Braves"
    "Brooklyn Dodgers": "Los Angeles Dodgers"
    "Florida Marlins": "Miami Marlins"
    "Montreal Expos": "Washington Nationals"
    "Montréal Expos": "Washington Nationals"
    # The historical New York baseball Giants, not the NFL club of that name.
    "New York Giants": "San Francisco Giants"
    "St. Louis Browns": "Baltimore Orioles"
    "Seattle Pilots": "Milwaukee Brewers"
    "Tampa Bay Devil Rays": "Tampa Bay Rays"
    # Deliberately absent: "Washington Senators". The name covers two
    # franchises -- the 1961 Twins and the 1972 Rangers -- so it keeps its own
    # category rather than being filed on a guess.

    # --- MLB: minor-league affiliates -> parent club --------------------------
    "ACL Dodgers": "Los Angeles Dodgers"
    "Bowling Green Hot Rods": "Tampa Bay Rays"
    "Fredericksburg Nationals": "Washington Nationals"
    "Jacksonville Jumbo Shrimp": "Miami Marlins"
    "Jupiter Hammerheads": "Miami Marlins"
    "Visalia Rawhide": "Arizona Diamondbacks"

    # --- Negro leagues -------------------------------------------------------
    # Collected with the fallback rather than by club: one category keeps them
    # findable instead of scattering single cards across four near-empty ones.
    "Homestead Grays": "Other Teams"
    "Kansas City Monarchs": "Other Teams"
    "Newark Eagles": "Other Teams"
    "Pittsburgh Crawfords": "Other Teams"

    # --- League-level values on All-Star and leader cards ---------------------
    "National League": "Other Teams"
    "American League": "Other Teams"

    # --- College: one or two cards each, so not worth their own categories ----
    "Marquette Golden Eagles": "Other Teams"
    "Ole Miss Rebels": "Other Teams"
    "SMU Mustangs": "Other Teams"

    # --- NBA: renamed or relocated -------------------------------------------
    "Charlotte Bobcats": "Charlotte Hornets"
    "New Jersey Nets": "Brooklyn Nets"
    "New Orleans Hornets": "New Orleans Pelicans"
    "Seattle Supersonics": "Oklahoma City Thunder"
    "Seattle SuperSonics": "Oklahoma City Thunder"
    "Vancouver Grizzlies": "Memphis Grizzlies"
    "Washington Bullets": "Washington Wizards"
    "Portland Trail blazers": "Portland Trail Blazers"

    # --- NFL: renamed or relocated -------------------------------------------
    "Oakland Raiders": "Las Vegas Raiders"
    "San Diego Chargers": "Los Angeles Chargers"
    "St. Louis Rams": "Los Angeles Rams"
    "Baltimore Colts": "Indianapolis Colts"
    "Houston Oilers": "Tennessee Titans"
    "Tennessee Oilers": "Tennessee Titans"
    "Phoenix Cardinals": "Arizona Cardinals"
    "St. Louis Cardinals (NFL)": "Arizona Cardinals"
    "Washington Redskins": "Washington Commanders"
    "Washington Football Team": "Washington Commanders"

# Title shorthand -> the word buyers actually search for.
#
# Applied to standalone tokens only, whether bare ("... Judge RC") or inside a
# trailing group ("... Judge (AU,RC)"). Card numbers such as "#RC-6" are left
# alone. A null value means the token is recognized -- so it keeps its place at
# the end of the title, ahead of nothing and behind the team -- but is not
# rewritten.
token_expansions:
  RC: "Rookie"
  AU: "Auto"
  AUTO: "Auto"
  SP: null
  SSP: null

# Tokens dropped from titles entirely.
token_removals:
  - MEM

# An expansion is skipped when the title already says the same thing another
# way: "Rookie Revolution ... (RC)" keeps the insert name and drops the (RC)
# rather than ending in "Rookie Rookie". Matched whole-word, case-insensitively.
token_synonyms:
  Rookie:
    - Rookie
    - Rookies
    - RC
  Auto:
    - Auto
    - Autos
    - Autograph
    - Autographs
    - Autographed

# Phrases stripped from every title, wherever they appear. Whitespace around
# the removal is collapsed afterwards.
title_removals:
  - "Topps Baseball"
