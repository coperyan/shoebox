name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # The deploy image is a third supported host alongside macOS and Windows, so
  # it is built on every change rather than only when someone deploys. The smoke
  # test catches the failure mode that matters: a dependency that resolves on a
  # workstation but not in the container.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t shoebox:ci .

      - name: CLI responds
        run: docker run --rm shoebox:ci --help

      - name: Chrome-only extra is absent, and its absence is not fatal
        run: |
          docker run --rm --entrypoint python shoebox:ci -c "
          import importlib.util, shoebox.cli
          assert importlib.util.find_spec('undetected_chromedriver') is None, \
              'undetected-chromedriver should not be in the image'
          print('cli imports without the scrapers extra')
          "

      - name: Console-only logging writes no log directory
        run: |
          docker run --rm --entrypoint python shoebox:ci -c "
          import pathlib
          from shoebox.utils.logging_setup import setup_logging
          setup_logging()
          assert not pathlib.Path('logs').exists(), 'container should not write log files'
          print('logging is console-only')
          "
